# Local development only. Do not use these credentials for hosted environments.
# Bind the database port to loopback; do not expose it to the LAN or Internet.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tracelynt
      POSTGRES_USER: tracelynt_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only-change-me}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - tracelynt_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracelynt_app -d tracelynt"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tracelynt_pgdata:
